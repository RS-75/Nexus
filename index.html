<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#04070f">
<title>Nexus</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nexus">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root{--bg:#04070f;--glass:rgba(16,28,60,.55);--line:rgba(130,175,255,.16);--blue:#3b82f6;--txt:#f1f6ff;--dim:#93a8d0}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--txt);background:var(--bg);overflow:hidden}
body::before,body::after{content:"";position:fixed;width:55vmax;height:55vmax;border-radius:50%;filter:blur(100px);z-index:-1}
body::before{background:#1d4ed8;top:-25vmax;left:-20vmax;opacity:.5}
body::after{background:#0ea5e9;bottom:-30vmax;right:-20vmax;opacity:.28}
button,input{font:inherit;color:inherit}
input{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:14px;padding:13px 15px;outline:none;width:100%}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.25)}
.btn{background:linear-gradient(135deg,#2563eb,#38bdf8);border:0;border-radius:14px;padding:13px 18px;cursor:pointer;font-weight:600}
.glass{background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:20px}
/* splash */
#splash{position:fixed;inset:0;z-index:99;background:#04070f;display:grid;place-content:center;justify-items:center;gap:30px;transition:opacity .5s}
#splash img{width:112px;height:112px;border-radius:26px;box-shadow:0 0 60px rgba(59,130,246,.55);animation:pop .8s ease-out}
#splash .bar{width:190px;height:4px;border-radius:4px;background:rgba(120,170,255,.15);overflow:hidden}
#splash .bar i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,#38bdf8,#2563eb);box-shadow:0 0 12px #3b82f6;transition:width 1.4s cubic-bezier(.2,.7,.2,1)}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
/* auth */
#auth{height:100%;display:grid;place-items:center;padding:20px}
#auth form{width:min(380px,100%);padding:30px 26px;display:grid;gap:12px;text-align:center}
#auth img{width:84px;height:84px;border-radius:22px;margin:0 auto;box-shadow:0 0 40px rgba(59,130,246,.5)}
#auth h1{font-size:26px;letter-spacing:.04em}#auth p{color:var(--dim);font-size:14px;margin-bottom:6px}
#auth small{color:var(--dim);cursor:pointer;padding:6px}
/* app */
#app{display:none;flex-direction:column;height:100%;max-width:620px;margin:0 auto;position:relative}
.panel{display:none;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px 18px calc(96px + env(safe-area-inset-bottom))}
.panel.on{display:block}
.panel h2{font-size:30px;letter-spacing:-.02em}.panel .sub{color:var(--dim);margin:4px 0 20px}
.card{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;margin-bottom:10px;text-align:left;cursor:pointer;transition:.2s}
.card:active{transform:scale(.98);border-color:var(--blue)}
.card b{display:block;font-size:16px}.card span.d{color:var(--dim);font-size:13px}
.ico{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:22px;flex:none;background:linear-gradient(135deg,rgba(37,99,235,.55),rgba(56,189,248,.25));border:1px solid var(--line)}
.av{border-radius:50%;font-weight:700;font-size:18px}
/* tab bar */
#tabs{position:absolute;left:0;right:0;bottom:0;display:flex;padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:4px;z-index:5;border-radius:24px 24px 0 0;border-bottom:0;background:rgba(18,36,86,.82)}
#tabs button{flex:1;background:none;border:0;border-radius:18px;padding:8px 0 6px;color:var(--dim);display:grid;justify-items:center;gap:3px;font-size:11px;cursor:pointer;transition:.2s}
#tabs button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:#fff;background:rgba(59,130,246,.28);box-shadow:0 0 22px rgba(59,130,246,.35)}
/* conversation */
#chat{display:none;position:absolute;inset:0;flex-direction:column;z-index:10;background:rgba(4,7,15,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
#chat.on{display:flex}
#head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:17px}
#back{background:none;border:0;font-size:26px;cursor:pointer;padding:0 8px 4px 0;color:#7cb2ff}
#msgs{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;display:flex;flex-direction:column;gap:6px}
.m{max-width:80%;padding:9px 13px;border-radius:18px 18px 18px 6px;background:rgba(30,50,100,.6);border:1px solid var(--line);word-break:break-word;line-height:1.35;align-self:flex-start}
.m.me{align-self:flex-end;border-radius:18px 18px 6px 18px;background:linear-gradient(135deg,#2563eb,#0ea5e9);border:0}
.m b{display:block;font-size:12px;color:#8cc0ff;margin-bottom:2px}
.m a{color:#bfe3ff}.m audio{height:36px;max-width:100%}
.m time{display:block;font-size:10px;opacity:.55;text-align:right;margin-top:3px}
.empty{margin:auto;color:var(--dim);text-align:center}
#bar{display:flex;gap:8px;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
#bar input{border-radius:22px}
.round{width:46px;height:46px;border-radius:50%;padding:0;flex:none;display:grid;place-items:center;font-size:18px}
#mic{background:rgba(59,130,246,.22);border:1px solid var(--line);cursor:pointer}
#mic.rec{background:#dc2626;animation:p 1s infinite}@keyframes p{50%{opacity:.5}}
/* appel + réglages */
.hero{text-align:center;padding:40px 10px}.hero .ico{width:84px;height:84px;font-size:38px;margin:0 auto 18px;border-radius:26px}
.hero p{color:var(--dim);margin-top:8px;line-height:1.5}
.set{padding:18px;margin-bottom:12px;display:grid;gap:10px}.set label{color:var(--dim);font-size:13px}
.danger{background:rgba(220,38,38,.18);border:1px solid rgba(248,113,113,.35);border-radius:14px;padding:13px;cursor:pointer;width:100%;color:#fca5a5}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico{color:#a9d4ff}.ico .i{width:24px;height:24px}
.hero .ico .i{width:40px;height:40px}
#back .i{width:26px;height:26px}.round .i{width:20px;height:20px}
.chev{margin-left:auto;color:var(--dim)}.chev .i{width:18px;height:18px}
.danger{display:flex;align-items:center;justify-content:center;gap:8px}
.deals{display:none;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:rgba(37,99,235,.12);align-items:center;overflow-x:auto}
.deals.on{display:flex}
.deals a{flex:none;text-decoration:none;color:#fff;font-size:14px;font-weight:600;padding:9px 14px;border-radius:12px;background:rgba(59,130,246,.28);border:1px solid var(--line);display:flex;align-items:center;gap:7px}
.deals a:first-child{background:linear-gradient(135deg,#2563eb,#38bdf8);border:0}
.deals .i{width:18px;height:18px}
html{background:var(--bg);height:100%;height:100dvh}
body{height:100%;height:var(--h,100dvh);margin:0;overscroll-behavior:none}
.panel h2{font-size:clamp(24px,7.5vw,32px)}
#app{width:100%}
@media(min-width:900px){#app{max-width:760px}}
#call{display:none;position:absolute;inset:0;z-index:12;flex-direction:column;background:#04070f}
#call.on{display:flex}
#grid{flex:1;min-height:0;display:grid;gap:8px;padding:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));grid-auto-rows:1fr}
.tile{position:relative;border-radius:18px;overflow:hidden;background:#0a1228;border:1px solid var(--line);cursor:pointer}
.tile video{width:100%;height:100%;object-fit:cover;display:block}
.tile.fit video{object-fit:contain;background:#000}.tile.mirror video{transform:scaleX(-1)}
.tile.novid video{opacity:0}.ph{position:absolute;inset:0;display:none;place-items:center}.novid .ph{display:grid}
.nm{position:absolute;left:10px;bottom:8px;font-size:12px;background:rgba(0,0,0,.55);padding:3px 10px;border-radius:10px}
#ctl{display:flex;justify-content:center;gap:14px;padding:12px 12px calc(16px + env(safe-area-inset-bottom))}
.cb{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:rgba(30,50,100,.55);cursor:pointer;display:grid;place-items:center}
.cb .i{width:24px;height:24px}.cb.act{background:linear-gradient(135deg,#2563eb,#38bdf8);border:0}
.cb.mute{background:rgba(220,38,38,.45)}.cb.end{background:#dc2626;border:0}.cb.end .i{transform:rotate(135deg)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0;color:var(--dim)}
.chip{padding:6px 12px;border-radius:20px;background:rgba(59,130,246,.22);border:1px solid var(--line);color:var(--txt);font-size:14px}
.kb #bar{padding-bottom:10px}.kb #tabs{padding-bottom:8px}
#imgBtn{background:rgba(59,130,246,.22);border:1px solid var(--line);cursor:pointer}
.row{display:flex;gap:8px;align-items:flex-end;max-width:88%;align-self:flex-start}.row.me{align-self:flex-end}
.col{display:flex;flex-direction:column;min-width:0}.row.me .col{align-items:flex-end}.col .m{max-width:100%;align-self:auto}
.q{font-size:12px;opacity:.8;border-left:3px solid #8cc0ff;padding-left:8px;margin-bottom:5px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pic{max-width:100%;max-height:320px;border-radius:12px;display:block}
.rx{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.rc{padding:2px 9px;border-radius:12px;background:rgba(59,130,246,.2);border:1px solid var(--line);font-size:13px;cursor:pointer}.rc.mine{border-color:var(--blue);background:rgba(59,130,246,.45)}
.badge{margin-left:auto;min-width:22px;height:22px;border-radius:11px;background:#2563eb;display:grid;place-items:center;font-size:12px;font-weight:700;padding:0 6px;box-shadow:0 0 12px rgba(59,130,246,.6)}.badge+.chev{margin-left:8px}
#replyBar{display:none;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--dim);background:rgba(37,99,235,.12)}
#replyTxt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#replyX{background:none;border:0;color:var(--dim);font-size:18px;cursor:pointer}
body{background:radial-gradient(80% 40% at 50% 100%,rgba(29,78,216,.38),transparent 70%),var(--bg)}
.act{display:none;flex-direction:column;gap:6px;margin-top:6px}.open .act{display:flex}.row.me .act{align-items:flex-end}
.pick{display:flex;gap:2px;padding:5px 8px;border-radius:28px;background:rgba(18,32,72,.94);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 24px rgba(0,0,0,.45);animation:pop2 .18s ease-out}
.pick button{background:none;border:0;cursor:pointer;padding:3px;border-radius:50%;transition:transform .15s}.pick button:active{transform:scale(1.35)}
.pick .em{width:28px;height:28px}
.acts{display:flex;gap:6px}
.acts button{display:flex;align-items:center;gap:6px;background:rgba(18,32,72,.94);border:1px solid var(--line);border-radius:14px;padding:7px 12px;font-size:14px;cursor:pointer}
.acts .i{width:16px;height:16px}.acts .del{color:#fca5a5;border-color:rgba(248,113,113,.4)}
@keyframes pop2{from{opacity:0;transform:scale(.9) translateY(4px)}}
.em{width:1.2em;height:1.2em;vertical-align:-.2em}.rc .em{width:16px;height:16px;vertical-align:-3px}
.st{position:absolute;top:8px;left:8px;font-size:11px;background:rgba(0,0,0,.6);padding:3px 9px;border-radius:10px;display:none;max-width:90%}
.yt{position:relative;aspect-ratio:16/9;width:260px;max-width:100%;border-radius:12px;overflow:hidden;margin-top:6px;background:#000;cursor:pointer}
.yt img{width:100%;height:100%;object-fit:cover;display:block}.yt iframe{width:100%;height:100%;border:0;display:block}
.yt .play{position:absolute;inset:0;margin:auto;width:54px;height:54px;border-radius:50%;background:rgba(37,99,235,.9);box-shadow:0 0 24px rgba(59,130,246,.7)}
.yt .play::after{content:"";position:absolute;left:21px;top:16px;border-left:18px solid #fff;border-top:11px solid transparent;border-bottom:11px solid transparent}
</style>
</head>
<body>

<div id="probe" style="position:fixed;left:0;bottom:0;width:1px;height:env(safe-area-inset-bottom);visibility:hidden"></div>
<div id="splash"><img src="icon.svg" alt=""><div class="bar"><i id="fill"></i></div></div>

<div id="auth">
  <form class="glass" id="authForm">
    <img src="icon.svg" alt=""><h1>NEXUS</h1><p>Votre espace, entre amis.</p>
    <input id="user" placeholder="Pseudo" autocomplete="username" style="display:none">
    <input id="email" type="email" placeholder="Email" required autocomplete="email">
    <input id="pass" type="password" placeholder="Mot de passe (6+ caractères)" required autocomplete="current-password">
    <button class="btn" id="authBtn">Se connecter</button>
    <small id="toggle">Pas de compte ? Créer un compte</small>
    <small id="err" style="color:#f87171;cursor:default"></small>
  </form>
</div>

<div id="app">
  <section class="panel on" id="p-salons"><h2 id="hello">Salons</h2><p class="sub">Choisis où discuter</p><div id="channels"></div></section>
  <section class="panel" id="p-prive"><h2>Privé</h2><p class="sub">Discussions entre vous deux</p><div id="dms"></div></section>
  <section class="panel" id="p-appel"><div class="hero"><div class="ico" data-i="phone"></div><h2>Appel</h2>
    <p>Voix, vidéo et partage d’écran avec vos amis.</p>
    <div class="chips" id="who"></div><button class="btn" id="joinBtn">Rejoindre l’appel</button>
    <p id="note" style="font-size:13px"></p></div></section>
  <section class="panel" id="p-reglages"><h2>Réglages</h2><p class="sub">Ton profil</p>
    <div class="glass set"><div id="me" style="display:flex;align-items:center;gap:14px"></div>
      <label for="newname">Changer de pseudo</label><input id="newname" maxlength="20">
      <button class="btn" id="saveName">Enregistrer</button></div>
    <button class="danger" id="logout" data-i="logout">Se déconnecter</button>
    <p id="diag" style="color:var(--dim);font-size:12px;margin-top:18px;text-align:center;line-height:1.5"></p></section>

  <nav id="tabs" class="glass">
    <button data-t="salons" data-i="chat" class="on">Salons</button>
    <button data-t="prive" data-i="users">Privé</button>
    <button data-t="appel" data-i="phone">Appel</button>
    <button data-t="reglages" data-i="sliders">Réglages</button>
  </nav>

  <div id="chat">
    <div id="head"><button id="back" data-i="back"></button><span id="title"></span></div>
    <div class="deals" id="deals"></div>
    <div id="msgs"></div>
    <div id="replyBar"><span id="replyTxt"></span><button id="replyX">✕</button></div>
    <div id="bar">
      <button class="round" id="imgBtn" title="Photo" data-i="image"></button><input type="file" id="imgIn" accept="image/*" hidden>
      <button class="round" id="mic" title="Message vocal" data-i="mic"></button>
      <input id="text" placeholder="Message… (/dé /pile /tirage)" autocomplete="off">
      <button class="btn round" id="send" data-i="send"></button>
    </div>
  </div>
  <div id="call"><button class="btn" id="snd" style="display:none;margin:10px 12px 0">Toucher pour activer le son</button><div id="grid"></div><div id="ctl">
    <button class="cb" id="cMic" data-i="mic" title="Micro"></button>
    <button class="cb" id="cCam" data-i="video" title="Caméra"></button>
    <button class="cb" id="cScr" data-i="screen" title="Partager l’écran"></button>
    <button class="cb end" id="cEnd" data-i="phone" title="Quitter"></button></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://yugsfrkvmgjtymbwocqs.supabase.co';
const SUPABASE_KEY = 'sb_publishable_37O6tX6P-t7c0gJHmyUv2A_E6FP-zWG';

const CHANNELS = [['general','chat','Général','Discussion libre'],['bons-plans','tag','Bons plans','Les bons plans à ne pas rater'],['films','film','Films','Liens et avis films'],['series','tv','Séries','Les séries du moment']];
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const IC = {
 chat:'<path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-4 3.2-6 6.5-6s6 2 6.5 6"/><path d="M16 5a3.5 3.5 0 010 7M19 14c1.5.8 2.3 2.7 2.5 5"/>',
 phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/>',
 sliders:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',

 back:'<path d="M15 5l-7 7 7 7"/>', next:'<path d="M9 5l7 7-7 7"/>',

let me, names = {}, pics = {}, roles = {}, channel = 'general', signup = false, rec, chunks = [];

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const linkify = s => esc(s).replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');

  : `<div class="ico av" style="width:${s}px;height:${s}px;background:linear-gradient(135deg,hsl(${hue(n)} 85% 45%),hsl(${hue(n) + 30} 90% 62%))">${esc(n[0] || '?').toUpperCase()}</div>`;

document.addEventListener('gesturestart', e => e.preventDefault());

const vv = window.visualViewport;
function diag() {
  const d = $('diag'); if (!d) return;
  const inst = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  d.textContent = `Diagnostic : ${inst ? 'appli installée' : 'navigateur'} · écran ${screen.width}×${screen.height} · fenêtre ${innerWidth}×${innerHeight} · marge basse ${$('probe').offsetHeight}px · appli ${document.body.offsetHeight}px`;
}
function gapColor() {}
function fit() {
  const r = document.documentElement, kb = vv && innerHeight - vv.height > 120;
  r.classList.toggle('kb', !!kb);
  if (kb) r.style.setProperty('--h', vv.height + 'px'); else r.style.removeProperty('--h');
  window.scrollTo(0, 0); diag();
}

// Pour de meilleurs résultats en 4G/5G, ajoute ici un serveur TURN.
const TURN = [
  // Colle ici les serveurs TURN de ton compte gratuit metered.ca, par exemple :

const ICE = [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }, ...TURN];
let cch, inCall = false, peers = {}, aTrack = null, camTrack = null, scrTrack = null, vTrack = null;
const localView = new MediaStream();
const sig = (to, type, data) => cch.send({ type: 'broadcast', event: 'sig', payload: { to, from: me.id, type, data } });

function setupCall() {
  cch = db.channel('call', { config: { presence: { key: me.id } } });
  cch.on('presence', { event: 'sync' }, callSync)
     .on('presence', { event: 'leave' }, ({ key }) => dropPeer(key))
     .on('broadcast', { event: 'sig' }, ({ payload }) => onSig(payload))
     .subscribe();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
    $('cScr').style.display = 'none';
    $('note').textContent = 'Le partage d’écran n’est pas disponible sur iPhone, mais tu peux voir celui des autres.';
  }

  $('who').innerHTML = ids.length ? ids.map(id => `<span class="chip">${esc(st[id][0].name)}</span>`).join('') : 'Personne dans l’appel';
}
function playStream(t, stream) {
  const v = t.querySelector('video'), a = t.querySelector('audio');
  v.srcObject = stream; v.play().catch(() => {});
  if (a) { a.srcObject = stream; a.play().catch(() => { $('snd').style.display = 'block'; }); }
}
function setSt(id, st) {
  const t = $('t-' + id), b = t && t.querySelector('.st'); if (!b) return;
  const m = { new: 'Connexion…', checking: 'Connexion…', disconnected: 'Connexion perdue…', failed: 'Échec : réseau bloqué (serveur TURN requis)' };
  b.textContent = m[st] || ''; b.style.display = m[st] ? 'block' : 'none';
}
$('snd').onclick = () => { document.querySelectorAll('#grid audio').forEach(a => a.play()); $('snd').style.display = 'none'; };
function mkPeer(id) {
  if (peers[id]) return peers[id];
  const pc = new RTCPeerConnection({ iceServers: ICE }), p = peers[id] = { pc, pending: [], stream: new MediaStream() };
  addTile(id, names[id]); setSt(id, 'checking');
  pc.onicecandidate = e => e.candidate && sig(id, 'ice', e.candidate);
  pc.ontrack = e => {
    p.stream.addTrack(e.track);
    const t = addTile(id, names[id]); playStream(t, p.stream);
    if (e.track.kind === 'video') {
      const f = () => t.classList.toggle('novid', e.track.muted);
      e.track.onmute = f; e.track.onunmute = f; f();
    }
  };
  pc.oniceconnectionstatechange = () => setSt(id, pc.iceConnectionState);
  pc.onconnectionstatechange = () => { if (pc.connectionState === 'failed') pc.restartIce && pc.restartIce(); };
  return p;
}
function attach(pc) {
  pc.getTransceivers().forEach(t => { t.direction = 'sendrecv'; t.sender.replaceTrack(t.receiver.track.kind === 'audio' ? aTrack : vTrack); });
}
async function connectTo(id) {
  const { pc } = mkPeer(id);
  pc.addTransceiver('audio'); pc.addTransceiver('video'); attach(pc);
  await pc.setLocalDescription(await pc.createOffer());
  sig(id, 'offer', pc.localDescription);
}
const flush = p => p.pending.splice(0).forEach(c => p.pc.addIceCandidate(c).catch(() => {}));
async function onSig({ to, from, type, data }) {
  if (to !== me.id || !inCall) return;
  const p = mkPeer(from), pc = p.pc;
  try {
    if (type === 'offer') {
      if (pc.signalingState !== 'stable') { if (me.id < from) return; await pc.setLocalDescription({ type: 'rollback' }); }
      await pc.setRemoteDescription(data); attach(pc);
      await pc.setLocalDescription(await pc.createAnswer());
      sig(from, 'answer', pc.localDescription); flush(p);
    } else if (type === 'answer') { await pc.setRemoteDescription(data); flush(p); }
    else if (type === 'ice') { pc.remoteDescription ? await pc.addIceCandidate(data) : p.pending.push(data); }
  } catch (e) { console.warn(e); }
}
function dropPeer(id) {
  if (peers[id]) { peers[id].pc.close(); delete peers[id]; }
  const t = $('t-' + id); if (t) t.remove();
}
function addTile(id, name, local) {
  let t = $('t-' + id); if (t) return t;
  t = document.createElement('div'); t.id = 't-' + id; t.className = 'tile novid';
  t.innerHTML = `<video autoplay playsinline muted></video>${local ? '' : '<audio autoplay playsinline></audio>'}<span class="st"></span><div class="ph">${avatar(name || '?', 72, id)}</div><span class="nm">${esc(name || '?')}${local ? ' (toi)' : ''}</span>`;
  t.onclick = () => t.classList.toggle('fit');
  $('grid').append(t);
  if (local) t.querySelector('video').srcObject = localView;
  return t;
}
function setVideo(track) {
  vTrack = track;
  localView.getVideoTracks().forEach(t => localView.removeTrack(t));
  if (track) localView.addTrack(track);
  const me_t = $('t-' + me.id);
  if (me_t) { me_t.classList.toggle('novid', !track); me_t.classList.toggle('mirror', !!track && track === camTrack); }
  Object.values(peers).forEach(p => p.pc.getTransceivers().forEach(t => t.receiver.track.kind === 'video' && t.sender.replaceTrack(track)));
  updBtns();
}
function updBtns() {
  $('cCam').classList.toggle('act', !!camTrack); $('cScr').classList.toggle('act', !!scrTrack);
  $('cMic').classList.toggle('mute', !aTrack || !aTrack.enabled);
}
async function joinCall() {
  if (inCall) return;
  try { aTrack = (await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } })).getAudioTracks()[0]; }
  catch { aTrack = null; alert('Micro non autorisé : tu pourras écouter mais pas parler.'); }
  inCall = true; $('call').classList.add('on'); gapColor(); addTile(me.id, names[me.id], true); updBtns();
  await cch.track({ name: names[me.id] || '?' });
  Object.keys(cch.presenceState()).filter(id => id !== me.id).forEach(connectTo);
}
async function leaveCall() {
  inCall = false; Object.keys(peers).forEach(dropPeer);
  [aTrack, camTrack, scrTrack].forEach(t => t && t.stop());
  aTrack = camTrack = scrTrack = vTrack = null;
  localView.getTracks().forEach(t => localView.removeTrack(t));
  await cch.untrack(); $('grid').innerHTML = ''; $('call').classList.remove('on'); gapColor();
}
async function toggleCam() {
  if (camTrack) { camTrack.stop(); camTrack = null; if (!scrTrack) setVideo(null); return updBtns(); }
  try {
    camTrack = (await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 } } })).getVideoTracks()[0];
    if (!scrTrack) setVideo(camTrack); updBtns();
  } catch { alert('Caméra non autorisée.'); }
}
async function toggleScreen() {
  if (scrTrack) { scrTrack.stop(); return endScreen(); }
  try { scrTrack = (await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false })).getVideoTracks()[0]; scrTrack.onended = endScreen; setVideo(scrTrack); }
  catch {}
}
function endScreen() { scrTrack = null; setVideo(camTrack); }
$('joinBtn').onclick = joinCall; $('cEnd').onclick = leaveCall; $('cCam').onclick = toggleCam; $('cScr').onclick = toggleScreen;
$('cMic').onclick = () => { if (aTrack) aTrack.enabled = !aTrack.enabled; updBtns(); };

async function uploadPhoto(file) {
  try {
    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = URL.createObjectURL(file); });
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const m = Math.min(img.width, img.height);
    c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, 256, 256);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .85));
    const path = `${me.id}/avatar.jpg`;
    const up = await db.storage.from('avatars').upload(path, blob, { contentType: 'image/jpeg', upsert: true });
    if (up.error) throw up.error;
    const url = db.storage.from('avatars').getPublicUrl(path).data.publicUrl + '?v=' + Date.now();
    const { error } = await db.from('profiles').update({ avatar_url: url }).eq('id', me.id);
    if (error) throw error;
    pics[me.id] = url; render();
  } catch (e) { alert('Photo impossible : ' + (e.message || e)); }
}

  $('chat').classList.add('on'); gapColor();

  if (!data || !data.length) $('msgs').innerHTML = '<div class="empty">Aucun message.<br>Lance la conversation</div>';
  msgCache = {}; reacts = {}; setReply(null);
  (data || []).forEach(addMsg);

    (rs || []).forEach(r => (reacts[r.message_id] = reacts[r.message_id] || []).push(r));

  }
}

function cmd(t) {
  const [c, ...a] = t.split(/\s+/), who = names[me.id] || 'Quelqu’un';
  if (c === '/dé' || c === '/de') { const n = Math.max(2, +a[0] || 6); return `🎲 ${who} lance un dé à ${n} faces : ${1 + rnd(n)}`; }
  if (c === '/pile') return `🪙 ${who} lance une pièce : ${rnd(2) ? 'Pile' : 'Face'}`;
  if (c === '/tirage') {
    const l = a.join(' ').split(',').map(x => x.trim()).filter(Boolean);
    return l.length > 1 ? `🎯 Tirage au sort (${l.length} choix) : ${l[rnd(l.length)]}` : 'Utilisation : /tirage film A, film B, film C';
  }
  return null;
}
$('send').onclick = async () => {
  let t = $('text').value.trim(); if (!t) return; $('text').value = '';
  if (t[0] === '/') t = cmd(t) || t;
  await send({ content: t });
};
$('text').onkeydown = e => { if (e.key === 'Enter') $('send').click(); };

// Vocal
$('mic').onclick = async () => {
  if (rec && rec.state === 'recording') return rec.stop();
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    rec = new MediaRecorder(stream); chunks = [];
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = async () => {
      stream.getTracks().forEach(t => t.stop()); $('mic').classList.remove('rec');
      const type = rec.mimeType || 'audio/webm';
      const path = `${me.id}/${Date.now()}.${type.includes('mp4') ? 'm4a' : 'webm'}`;
      const { error } = await db.storage.from('voice').upload(path, new Blob(chunks, { type }), { contentType: type });
      if (error) return alert(error.message);
      send({ audio_url: db.storage.from('voice').getPublicUrl(path).data.publicUrl });
    };
    rec.start(); $('mic').classList.add('rec');
  } catch { alert('Micro non autorisé.'); }
};
</script>
